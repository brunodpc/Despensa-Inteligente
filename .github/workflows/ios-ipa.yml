name: iOS - IPA para teste (sem assinatura)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

jobs:
  build:
    # Necessário para Xcode/CocoaPods. Não gera build assinado para a App Store.
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Build web
        run: npm run build

      - name: Sincronizar Capacitor
        run: npx cap sync ios

      - name: CocoaPods
        working-directory: ios/App
        run: pod install

      - name: Compilar app sem assinatura
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build

      - name: Empacotar IPA
        run: |
          mkdir -p Payload
          cp -R ios/build/Build/Products/Debug-iphoneos/App.app Payload/App.app
          zip -qr Despensa-Inteligente.ipa Payload

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: despensa-ios-ipa
          path: Despensa-Inteligente.ipa
          if-no-files-found: error
          retention-days: 30
