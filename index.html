<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#203c32" />
    <meta name="referrer" content="no-referrer" />
    <meta name="description" content="Organize sua despensa, planeje compras e acompanhe os gastos da sua cozinha." />
    <script>
      try {
        var raw = localStorage.getItem('despensa-inteligente.app-preferences.v1')
        var theme = raw ? (JSON.parse(raw).theme || 'light') : 'light'
        var dark = theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.querySelector('meta[name="theme-color"]').content = dark ? '#101612' : '#203c32'
      } catch (error) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/icons/brand.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Despensa Inteligente</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
